name: macOS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # gh release create needs it; the default token is read-only

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show available Xcode
        run: xcodebuild -version

      - name: Check tag matches project MARKETING_VERSION
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PBX_VERSION=$(sed -n 's/.*MARKETING_VERSION = \([0-9.]*\);.*/\1/p' BusyMirror.xcodeproj/project.pbxproj | head -n1)
          echo "Tag: $TAG_VERSION  Project: $PBX_VERSION"
          if [ "$TAG_VERSION" != "$PBX_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match MARKETING_VERSION ($PBX_VERSION) in project.pbxproj"
            exit 1
          fi
        if: github.event_name == 'push'

      - name: Run unit tests
        run: |
          xcodebuild -project BusyMirror.xcodeproj -scheme BusyMirror -destination 'platform=macOS' \
            -only-testing:BusyMirrorTests test

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          echo -n "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 1800 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          rm -f "$RUNNER_TEMP/cert.p12"

          # Sign by certificate hash, not common name — the Developer ID name has accented
          # characters (TOMÁŠ KRÁČMAR) that codesign can fail to match by string on some
          # locales/encodings (hit this exact issue running make package by hand). The hash
          # is unambiguous.
          SIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | awk '{print $2}')
          if [ -z "$SIGN_IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found after import"
            exit 1
          fi
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
        run: |
          echo -n "$AC_API_KEY_P8_BASE64" | base64 --decode -o "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials "ci-notary" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Build, sign, notarize, package
        run: |
          make package SIGN_IDENTITY="$SIGN_IDENTITY" NOTARY_PROFILE="ci-notary"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "BusyMirror-${VERSION}-macOS.dmg" \
            "BusyMirror-${VERSION}-macOS.dmg.sha256" \
            "BusyMirror-${VERSION}-macOS.zip" \
            "BusyMirror-${VERSION}-macOS.zip.sha256" \
            --title "BusyMirror ${VERSION}" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
